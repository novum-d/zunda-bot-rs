name: Codex Issue Automation

on:
  issues:
    types: [ labeled ]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  codex:
    if: github.event_name == 'issues' && github.event.label.name == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Classify issue
        id: issue_type
        run: |
          issue_title=$(printf '%s\n' "${{ github.event.issue.title }}")
          issue_body=$(printf '%s\n' "${{ github.event.issue.body }}")

          issue_kind="generic"
          requires_src_tests="false"

          if printf '%s\n' "$issue_title" | grep -q '^\[👔 ロジック実装\]'; then
            issue_kind="logic"
            requires_src_tests="true"
          elif printf '%s\n' "$issue_title" | grep -q '^\[🐛 バグ\]'; then
            issue_kind="bug"
            requires_src_tests="true"
          elif printf '%s\n' "$issue_title" | grep -q '^\[💡 機能提案\]'; then
            issue_kind="feature"
            requires_src_tests="true"
          elif printf '%s\n' "$issue_title" | grep -q '^\[🎨 UI実装\]'; then
            issue_kind="ui"
            requires_src_tests="true"
          elif printf '%s\n' "$issue_title" | grep -q '^\[🏗️ 雑用\]'; then
            issue_kind="chore"
          elif printf '%s\n' "$issue_title" | grep -q '^\[👋 後で実装\]'; then
            issue_kind="later"
          elif printf '%s\n' "$issue_body" | grep -qiE '^## Context$' \
            && printf '%s\n' "$issue_body" | grep -qiE '^## Goal$' \
            && printf '%s\n' "$issue_body" | grep -qiE '^## Acceptance Criteria$'; then
            issue_kind="codex"
            if printf '%s\n' "$issue_body" | grep -q '^- \[x\] Implementation'; then
              requires_src_tests="true"
            elif printf '%s\n' "$issue_body" | grep -q '^- \[x\] Maintenance / Docs'; then
              requires_src_tests="false"
            elif printf '%s\n' "$issue_body" | grep -qE '^\* src/|^\* tests/'; then
              requires_src_tests="true"
            fi
          fi

          echo "kind=$issue_kind" >> "$GITHUB_OUTPUT"
          echo "requires_src_tests=$requires_src_tests" >> "$GITHUB_OUTPUT"

      - name: Prepare prompt
        run: |
          mkdir -p .codex

          cat > .codex/prompt.md << 'EOF'
          You are implementing a GitHub issue for this repository.

          Before making changes, read:
          - AGENTS.md
          - docs/ai/SKILLS.md
          - docs/ai/ARCHITECTURE.md
          - docs/ai/TESTING.md
          - docs/ai/DECISIONS.md

          Issue title:
          ${{ github.event.issue.title }}

          Issue body:
          ${{ github.event.issue.body }}

          Detected issue kind:
          ${{ steps.issue_type.outputs.kind }}

          Rules:
          - Follow AGENTS.md
          - If the issue explicitly allows scope overrides, follow the issue scope
          - Do not modify forbidden files
          - For implementation issues, do not finish with only .codex, prompt, or documentation changes
          - For implementation issues, include at least one behavior-related change under src/** and validate it in tests/** when possible
          - If repository policy blocks the required code path, stop and report the blocked path clearly
          - Do not touch workflows, deploy, infra, or secrets unless the issue explicitly allows it
          - Write PR title and body in Japanese
          - Run cargo fmt --check, cargo clippy --all-targets --all-features -- -D warnings, cargo test when possible
          - If fmt, clippy, or test fails, record the failure and continue
          - Stop if approval is required
          - Keep changes focused on the issue only
          EOF

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1.6
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex/prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Restore generated Codex prompt
        run: git checkout -- .codex/prompt.md

      # 差分の取り方を修正（誤検知防止）
      - name: Get changed files
        id: changes
        run: |
          changed_files=$(git diff --name-only -- . ':(exclude).codex')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 禁止ファイルは失敗させず巻き戻す
      - name: Check forbidden paths
        run: |
          forbidden=(
            ".github/workflows/"
            "infra/"
            "deploy/"
            "secrets/"
            ".env"
            ".env.local"
          )

          echo "${{ steps.changes.outputs.files }}" | while read file; do
            for path in "${forbidden[@]}"; do
              if [[ "$file" == *"$path"* ]]; then
                echo "::warning::Forbidden file changed: $file"
                echo "Reverting $file"
                git checkout -- "$file"
              fi
            done
          done

      - name: Check diff size
        run: |
          changed_files=$(git diff --name-only | wc -l)
          added_lines=$(git diff --shortstat | grep -o '[0-9]* insertion' | grep -o '[0-9]*' || echo 0)
          deleted_lines=$(git diff --shortstat | grep -o '[0-9]* deletion' | grep -o '[0-9]*' || echo 0)

          echo "Changed files: $changed_files"
          echo "Added lines: $added_lines"
          echo "Deleted lines: $deleted_lines"

      - name: Check dangerous commands
        run: |
          declare -A forbidden_patterns=(
            ["sudo"]='(^|[[:space:];|&`$()<])sudo([[:space:];|&`$()>]|$)'
            ["curl | sh"]='(^|[[:space:];|&`$()<])curl[[:space:]][^|]*\|[[:space:]]*sh([[:space:];|&`$()>]|$)'
            ["wget | sh"]='(^|[[:space:];|&`$()<])wget[[:space:]][^|]*\|[[:space:]]*sh([[:space:];|&`$()>]|$)'
            ["chmod 777"]='(^|[[:space:];|&`$()<])chmod[[:space:]]+777([[:space:];|&`$()>]|$)'
            ["mkfs"]='(^|[[:space:];|&`$()<])mkfs([.[:alnum:]_-]*)([[:space:];|&`$()>]|$)'
            ["dd if="]='(^|[[:space:];|&`$()<])dd[[:space:]][^;&|]*if='
            ["shutdown"]='(^|[[:space:];|&`$()<])shutdown([[:space:];|&`$()>]|$)'
            ["reboot"]='(^|[[:space:];|&`$()<])reboot([[:space:];|&`$()>]|$)'
            ["systemctl"]='(^|[[:space:];|&`$()<])systemctl([[:space:];|&`$()>]|$)'
            ["docker system prune"]='(^|[[:space:];|&`$()<])docker[[:space:]]+system[[:space:]]+prune([[:space:];|&`$()>]|$)'
            ["git push --force"]='(^|[[:space:];|&`$()<])git[[:space:]]+push[[:space:]][^;&|]*--force([[:space:];|&`$()>]|$)'
            ["git reset --hard"]='(^|[[:space:];|&`$()<])git[[:space:]]+reset[[:space:]][^;&|]*--hard([[:space:];|&`$()>]|$)'
            ["nohup"]='(^|[[:space:];|&`$()<])nohup([[:space:];|&`$()>]|$)'
            ["tmux"]='(^|[[:space:];|&`$()<])tmux([[:space:];|&`$()>]|$)'
            ["screen"]='(^|[[:space:];|&`$()<])screen([[:space:];|&`$()>]|$)'
            ["disown"]='(^|[[:space:];|&`$()<])disown([[:space:];|&`$()>]|$)'
          )

          while IFS= read -r -d '' file; do
            if [ "$file" = ".github/workflows/codex.yml" ]; then
              continue
            fi

            added_lines=$(git diff --unified=0 -- "$file" | grep '^+' | grep -v '^+++' || true)
            if [ -z "$added_lines" ]; then
              continue
            fi

            for command in "${!forbidden_patterns[@]}"; do
              if printf '%s\n' "$added_lines" | grep -Eq "${forbidden_patterns[$command]}"; then
                echo "Forbidden command detected in $file: $command"
                printf '%s\n' "$added_lines" | grep -E "${forbidden_patterns[$command]}"
                exit 1
              fi
            done
          done < <(git diff --name-only -z --diff-filter=ACMR)

      - name: Install Rust components
        run: |
          rustup component add rustfmt
          rustup component add clippy

      - name: Format check
        id: fmt
        continue-on-error: true
        run: cargo fmt --check

      - name: Check meaningful changes
        id: meaningful_changes
        run: |
          if git diff --quiet -- . ':(exclude).codex'; then
            echo "No meaningful changes"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Valid changes"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require implementation file changes
        if: steps.meaningful_changes.outputs.has_changes == 'true'
        run: |
          if [ "${{ steps.issue_type.outputs.requires_src_tests }}" = "true" ]; then
            if git diff --name-only | grep -qE '^(src/|tests/)'; then
              echo "Implementation-related files changed"
            else
              echo "Expected changes under src/ or tests/ for issue kind: ${{ steps.issue_type.outputs.kind }}"
              exit 1
            fi
          fi

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        id: test
        continue-on-error: true
        run: cargo test

      # 差分がない場合はPRを作らない
      - name: Check if changes exist
        id: diffcheck
        run: |
          if git diff --quiet -- . ':(exclude).codex'; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Pull Request metadata
        id: pr_metadata
        if: steps.diffcheck.outputs.no_changes == 'false'
        run: |
          issue_title=$(printf '%s\n' "${{ github.event.issue.title }}")
          safe_title=$(printf '%s\n' "$issue_title" | sed -E 's/^\[[^]]+\][[:space:]]*//')
          if [ -z "$safe_title" ]; then
            safe_title="Issue #${{ github.event.issue.number }} の対応"
          fi

          changed_files=$(git diff --name-only -- . ':(exclude).codex')
          {
            echo "title<<EOF"
            echo "$safe_title"
            echo "EOF"
            echo "changed_files<<EOF"
            printf '%s\n' "$changed_files" | sed '/^$/d; s/^/- /'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.diffcheck.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.issue_type.outputs.kind == 'chore' && format('🏗️ chore: Issue #{0} の雑用対応', github.event.issue.number) || steps.issue_type.outputs.kind == 'later' && format('🏗️ chore: Issue #{0} の保留タスク整理', github.event.issue.number) || steps.issue_type.outputs.kind == 'bug' && format('🐛 fix: Issue #{0} の不具合を修正', github.event.issue.number) || format('✨ feat: Issue #{0} の実装対応', github.event.issue.number) }}"
          title: "${{ steps.pr_metadata.outputs.title }}"
          body: |
            ## 概要
            - Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            - 種別: `${{ steps.issue_type.outputs.kind }}`

            ## 作業内容
            - Codex により Issue の要件に沿った変更を実施

            ## 作業意図
            - Issue #${{ github.event.issue.number }} の目的を満たすため

            ## 変更ファイル
            ${{ steps.pr_metadata.outputs.changed_files }}

            ## テスト結果
            - cargo fmt --check: ${{ steps.fmt.outcome }}
            - cargo clippy --all-targets --all-features -- -D warnings: ${{ steps.clippy.outcome }}
            - cargo test: ${{ steps.test.outcome }}

            ## 手動で次にするべき作業
            - レビュアーが差分とテスト結果を確認する

            ## 制限事項
            - PR 本文は workflow による自動生成のため、詳細な補足が必要な場合は人手で追記してください
            - fmt / clippy / test が failure の場合も、この workflow は結果を記録して Draft PR を作成します
          draft: true
          branch: codex/issue-${{ github.event.issue.number }}

  quality-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install components
        run: rustup component add rustfmt clippy

      - name: Format check
        continue-on-error: true
        run: cargo fmt --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        continue-on-error: true
        run: cargo test
