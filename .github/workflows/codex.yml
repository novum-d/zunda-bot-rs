name: Codex Issue Automation

on:
  issues:
    types: [ labeled ]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  codex:
    if: github.event_name == 'issues' && github.event.label.name == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Classify issue
        id: issue_type
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          issue_title=$ISSUE_TITLE
          issue_body=$ISSUE_BODY

          issue_kind="generic"

          if printf '%s\n' "$issue_title" | grep -q '^\[👔 ロジック実装\]'; then
            issue_kind="logic"
          elif printf '%s\n' "$issue_title" | grep -q '^\[🐛 バグ\]'; then
            issue_kind="bug"
          elif printf '%s\n' "$issue_title" | grep -q '^\[💡 機能提案\]'; then
            issue_kind="feature"
          elif printf '%s\n' "$issue_title" | grep -q '^\[🎨 UI実装\]'; then
            issue_kind="ui"
          elif printf '%s\n' "$issue_title" | grep -q '^\[🏗️ 雑用\]'; then
            issue_kind="chore"
          elif printf '%s\n' "$issue_title" | grep -q '^\[👋 後で実装\]'; then
            issue_kind="later"
          elif printf '%s\n' "$issue_body" | grep -qiE '^## Context$' \
            && printf '%s\n' "$issue_body" | grep -qiE '^## Goal$' \
            && printf '%s\n' "$issue_body" | grep -qiE '^## Acceptance Criteria$'; then
            issue_kind="codex"
          fi

          echo "kind=$issue_kind" >> "$GITHUB_OUTPUT"

      - name: Prepare prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_KIND: ${{ steps.issue_type.outputs.kind }}
        run: |
          mkdir -p .codex

          {
          cat << 'EOF'
          You are implementing a GitHub issue for this repository.

          Before making changes, read:
          - AGENTS.md
          - docs/ai/SKILLS.md
          - docs/ai/ARCHITECTURE.md
          - docs/ai/TESTING.md
          - docs/ai/DECISIONS.md

          Issue title:
          EOF
          printf '%s\n' "$ISSUE_TITLE"
          cat << 'EOF'

          Issue body:
          EOF
          printf '%s\n' "$ISSUE_BODY"
          cat << 'EOF'

          Detected issue kind:
          EOF
          printf '%s\n' "$ISSUE_KIND"
          cat << 'EOF'

          Rules:
          - Follow AGENTS.md
          - If the issue explicitly allows scope overrides, follow the issue scope
          - Treat explicit issue sections such as "Allowed restricted paths", "Scope Override", or "Files or directories allowed to change" as human authorization for those paths
          - If the issue explicitly defines a broad implementation, do not stop solely because the work is large
          - Restricted paths such as workflows, deploy, infra, Dockerfile, docker-compose.yml, database schema, release automation, and infrastructure-as-code may be changed only when the issue explicitly authorizes them
          - Never commit secrets, .env files, real tokens, passwords, private keys, generated private backups, game saves, player data, or private logs
          - Write PR title and body in Japanese
          - Run cargo fmt --check, cargo clippy --all-targets --all-features -- -D warnings, cargo test when possible
          - If fmt, clippy, or test fails, record the failure and continue
          - Do not stop for separate approval in this non-interactive workflow when the issue already grants the required authorization
          - Stop if a required restricted path is not authorized by the issue
          - Keep changes focused on the issue only
          EOF
          } > .codex/prompt.md

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1.6
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex/prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Restore generated Codex prompt
        run: git checkout -- .codex/prompt.md

      - name: Verify repository changes
        id: verify_changes
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_KIND: ${{ steps.issue_type.outputs.kind }}
        run: |
          changed_files=$(git diff --name-only -- . ':(exclude).codex')
          if [ -z "$changed_files" ]; then
            if [ "$ISSUE_KIND" = "later" ] \
              || printf '%s\n' "$ISSUE_BODY" | grep -qiE '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*(Investigation|Planning|Docs only|No repository changes required)[[:space:]]*$' \
              || printf '%s\n' "$ISSUE_BODY" | grep -qiE '^##[[:space:]]*(Investigation|Planning)[[:space:]]*$'; then
              echo "::notice::Codex did not create repository changes for a non-implementation issue. Skipping PR creation."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Codex did not create repository changes. Check the Run Codex log for blockers, scope-limit decisions, or approval requests."
            exit 1
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust components
        if: steps.verify_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          rustup component add rustfmt
          rustup component add clippy

      - name: Format check
        id: fmt
        if: steps.verify_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: cargo fmt --check

      - name: Clippy
        id: clippy
        if: steps.verify_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        id: test
        if: steps.verify_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: cargo test

      - name: Build Pull Request metadata
        id: pr_metadata
        if: steps.verify_changes.outputs.has_changes == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          issue_title=$ISSUE_TITLE
          safe_title=$(printf '%s\n' "$issue_title" | sed -E 's/^\[[^]]+\][[:space:]]*//')
          if [ -z "$safe_title" ]; then
            safe_title="Issue #${{ github.event.issue.number }} の対応"
          fi

          changed_files=$(git diff --name-only -- . ':(exclude).codex')
          {
            echo "title<<EOF"
            echo "$safe_title"
            echo "EOF"
            echo "changed_files<<EOF"
            printf '%s\n' "$changed_files" | sed '/^$/d; s/^/- /'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.verify_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.issue_type.outputs.kind == 'chore' && format('🏗️ chore: Issue #{0} の雑用対応', github.event.issue.number) || steps.issue_type.outputs.kind == 'later' && format('🏗️ chore: Issue #{0} の保留タスク整理', github.event.issue.number) || steps.issue_type.outputs.kind == 'bug' && format('🐛 fix: Issue #{0} の不具合を修正', github.event.issue.number) || format('✨ feat: Issue #{0} の実装対応', github.event.issue.number) }}"
          title: "${{ steps.pr_metadata.outputs.title }}"
          body: |
            ## 概要
            - Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            - 種別: `${{ steps.issue_type.outputs.kind }}`

            ## 作業内容
            - Codex により Issue の要件に沿った変更を実施

            ## 作業意図
            - Issue #${{ github.event.issue.number }} の目的を満たすため

            ## 変更ファイル
            ${{ steps.pr_metadata.outputs.changed_files }}

            ## テスト結果
            - cargo fmt --check: ${{ steps.fmt.outcome }}
            - cargo clippy --all-targets --all-features -- -D warnings: ${{ steps.clippy.outcome }}
            - cargo test: ${{ steps.test.outcome }}

            ## 手動で次にするべき作業
            - レビュアーが差分とテスト結果を確認する

            ## 制限事項
            - PR 本文は workflow による自動生成のため、詳細な補足が必要な場合は人手で追記してください
            - fmt / clippy / test が failure の場合も、この workflow は結果を記録して Draft PR を作成します
          draft: true
          branch: codex/issue-${{ github.event.issue.number }}

  quality-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install components
        continue-on-error: true
        run: rustup component add rustfmt clippy

      - name: Format check
        continue-on-error: true
        run: cargo fmt --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        continue-on-error: true
        run: cargo test
